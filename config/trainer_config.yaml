behaviors:
  ShipBrain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 4096
      learning_rate: 0.0005
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 4
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    behavioral_cloning:
      demo_path: D:/Unity/Projects/Pirates/Demonstrations
      strength: 0.5
      steps: 500000
      samples_per_update: 0
      num_epoch: 3
      batch_size: 128
    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 20000
    threaded: true
    self_play: null
